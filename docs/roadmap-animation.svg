<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="t d"><title id="t">Animated Teaching Studio roadmap</title><desc id="d">A glowing progress path moves from shipped features through next milestones to production readiness.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#050816"/><stop offset=".5" stop-color="#111827"/><stop offset="1" stop-color="#071a2b"/></linearGradient><linearGradient id="neon"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.c{fill:#0b1224;stroke:#334155;stroke-width:2}.txt{font:800 26px ui-monospace,monospace;fill:#e2e8f0}.sub{font:500 17px ui-monospace,monospace;fill:#94a3b8}.node{animation:p 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.beam{stroke:url(#neon);stroke-width:8;stroke-linecap:round;stroke-dasharray:18 26;animation:dash 1s linear infinite;filter:url(#glow)}.progress{stroke:url(#neon);stroke-width:5;stroke-linecap:round;stroke-dasharray:22 1000;animation:run 4.8s linear infinite}@keyframes dash{to{stroke-dashoffset:-44}}@keyframes p{0%,100%{transform:translateY(0);opacity:.7}50%{transform:translateY(-12px);opacity:1}}@keyframes run{to{stroke-dashoffset:-900}}</style></defs><rect width="1600" height="620" rx="40" fill="url(#bg)"/><text x="90" y="88" class="txt" style="font-size:45px">ROADMAP · SHIP THE NEXT LAYER</text><text x="90" y="124" class="sub">A continuously moving product path: core → refinement → scale → production</text><path d="M150 330 H1410" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/><path d="M150 330 H1410" class="progress" fill="none"/><path d="M360 330H540 M730 330H910 M1100 330H1280" class="beam" fill="none"/><g transform="translate(70 205)"><rect width="240" height="170" rx="26" class="c node"/><text x="28" y="55" class="txt">01 · NOW</text><text x="28" y="92" class="sub">Desktop recording</text><text x="28" y="120" class="sub">Webcam overlay</text><text x="28" y="148" class="sub">FFmpeg export</text></g><circle cx="360" cy="330" r="17" fill="#22c55e" filter="url(#glow)" class="node"/><g transform="translate(480 205)"><rect width="240" height="170" rx="26" class="c node" style="animation-delay:.5s"/><text x="28" y="55" class="txt">02 · NEXT</text><text x="28" y="92" class="sub">Hotkey editor</text><text x="28" y="120" class="sub">Recovery UI</text><text x="28" y="148" class="sub">Multi-monitor</text></g><circle cx="760" cy="330" r="17" fill="#38bdf8" filter="url(#glow)" class="node" style="animation-delay:1s"/><g transform="translate(850 205)"><rect width="240" height="170" rx="26" class="c node" style="animation-delay:1s"/><text x="28" y="55" class="txt">03 · SCALE</text><text x="28" y="92" class="sub">Automated builds</text><text x="28" y="120" class="sub">Code signing</text><text x="28" y="148" class="sub">Export profiles</text></g><circle cx="1130" cy="330" r="17" fill="#818cf8" filter="url(#glow)" class="node" style="animation-delay:1.5s"/><g transform="translate(1200 205)"><rect width="300" height="170" rx="26" class="c node" style="animation-delay:1.5s"/><text x="28" y="55" class="txt">04 · SHIP</text><text x="28" y="92" class="sub">Polished UX</text><text x="28" y="120" class="sub">Signed distribution</text><text x="28" y="148" class="sub">Production ready</text></g><g transform="translate(560 475)"><rect width="480" height="54" rx="27" fill="#020617" stroke="#334155"/><circle cx="30" cy="27" r="9" fill="#22c55e" class="node"/><text x="55" y="35" class="sub">ROADMAP ENGINE</text><text x="220" y="35" class="sub">moving toward production</text></g></svg>