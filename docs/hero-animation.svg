<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="t d">
<title id="t">Teaching Studio animated hero</title><desc id="d">Animated desktop recording workflow with screen capture, webcam overlay, audio and MP4 export.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0b1020"/><stop offset="0.5" stop-color="#111d3a"/><stop offset="1" stop-color="#061827"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .label{font:600 22px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#e2e8f0}.small{font:500 17px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#94a3b8}.title{font:800 54px system-ui,sans-serif;fill:#fff}.card{fill:#0f172a;stroke:#334155;stroke-width:2}.pulse{animation:p 2.2s ease-in-out infinite}.flow{stroke:url(#accent);stroke-width:7;stroke-linecap:round;stroke-dasharray:18 18;animation:dash 1.4s linear infinite}.bob{animation:b 2.8s ease-in-out infinite}.blink{animation:blink 1.6s steps(2,end) infinite}@keyframes p{50%{opacity:.45}100%{opacity:1}}@keyframes dash{to{stroke-dashoffset:-36}}@keyframes b{50%{transform:translateY(-12px)}}@keyframes blink{50%{opacity:.15}}
  </style>
</defs>
<rect width="1600" height="700" rx="40" fill="url(#bg)"/>
<g opacity=".18"><circle cx="130" cy="110" r="80" fill="#38bdf8"/><circle cx="1480" cy="590" r="120" fill="#6366f1"/></g>
<text x="110" y="125" class="title">TEACHING STUDIO</text>
<text x="110" y="165" class="small">A developer-grade recording pipeline for educators · Windows-first · Electron + React</text>

<g class="bob"><rect x="110" y="245" width="330" height="235" rx="24" class="card"/><text x="145" y="290" class="label">WINDOWS DESKTOP</text><rect x="145" y="320" width="260" height="110" rx="14" fill="#172554" stroke="#38bdf8" stroke-width="2"/><path d="M170 395h210" stroke="#38bdf8" stroke-width="4"/><rect x="310" y="340" width="65" height="44" rx="8" fill="#0b1020" stroke="#6366f1"/><circle cx="345" cy="362" r="13" fill="#38bdf8"/></g>
<path d="M445 365 C535 365 535 365 620 365" class="flow" fill="none"/>
<text x="490" y="330" class="small">getDisplayMedia()</text>

<g><rect x="625" y="215" width="350" height="300" rx="24" class="card"/><text x="665" y="260" class="label">RECORDING CORE</text><rect x="665" y="292" width="270" height="62" rx="14" fill="#0b1020" stroke="#475569"/><circle cx="700" cy="323" r="10" fill="#ef4444" class="pulse"/><text x="725" y="331" class="label">MEDIARECORDER</text><rect x="665" y="375" width="270" height="62" rx="14" fill="#0b1020" stroke="#475569"/><text x="700" y="414" class="label">WEBM CHUNKS</text><circle cx="905" cy="406" r="7" fill="#38bdf8"/><circle cx="930" cy="406" r="7" fill="#6366f1" class="blink"/></g>
<path d="M980 365 C1060 365 1060 365 1140 365" class="flow" fill="none"/>
<text x="1010" y="330" class="small">FFmpeg</text>

<g class="bob"><rect x="1145" y="245" width="340" height="235" rx="24" class="card"/><text x="1185" y="290" class="label">FINAL EXPORT</text><rect x="1185" y="320" width="260" height="100" rx="16" fill="#052e16" stroke="#22c55e" stroke-width="2"/><text x="1230" y="365" class="label">MP4 · H.264</text><text x="1230" y="394" class="small">AAC audio · ready to teach</text><circle cx="1405" cy="365" r="20" fill="none" stroke="#22c55e" stroke-width="5" class="pulse"/></g>

<g transform="translate(480 560)"><rect width="640" height="78" rx="39" fill="#020617" stroke="#334155"/><circle cx="42" cy="39" r="12" fill="#22c55e" class="pulse"/><text x="72" y="47" class="label">LIVE PIPELINE</text><text x="280" y="47" class="small">capture → overlay → chunks → encode → export</text></g>
</svg>
