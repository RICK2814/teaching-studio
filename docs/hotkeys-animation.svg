<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 560" role="img" aria-labelledby="t d"><title id="t">Animated Teaching Studio global hotkeys</title><desc id="d">Four keyboard keys animate in sequence to control recording.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#050816"/><stop offset=".5" stop-color="#111827"/><stop offset="1" stop-color="#0b132b"/></linearGradient><linearGradient id="neon"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.key{fill:#0b1224;stroke:#475569;stroke-width:4}.txt{font:800 28px ui-monospace,monospace;fill:#e2e8f0}.sub{font:500 17px ui-monospace,monospace;fill:#94a3b8}.press{animation:press 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.led{animation:led 4s ease-in-out infinite}.sweep{stroke:url(#neon);stroke-width:8;stroke-linecap:round;stroke-dasharray:20 24;animation:sweep 1s linear infinite;filter:url(#glow)}@keyframes press{0%,10%,100%{transform:translateY(0)}5%{transform:translateY(14px) scale(.97)}}@keyframes led{0%,10%,100%{opacity:.2}5%{opacity:1}}@keyframes sweep{to{stroke-dashoffset:-44}}</style></defs><rect width="1500" height="560" rx="38" fill="url(#bg)"/><text x="90" y="82" class="txt" style="font-size:44px">GLOBAL HOTKEYS</text><text x="90" y="118" class="sub">Press a key → trigger an action → keep teaching without touching the dashboard</text><g transform="translate(110 200)"><rect width="270" height="220" rx="30" class="key press"/><rect x="25" y="25" width="220" height="105" rx="20" fill="#020617" stroke="#334155"/><text x="105" y="92" class="txt">F9</text><text x="35" y="165" class="txt">START</text><text x="35" y="193" class="sub">recording</text><circle cx="220" cy="180" r="10" fill="#ef4444" class="led"/></g><path d="M395 310h100" class="sweep"/><g transform="translate(500 200)"><rect width="270" height="220" rx="30" class="key press" style="animation-delay:1s"/><rect x="25" y="25" width="220" height="105" rx="20" fill="#020617" stroke="#334155"/><text x="92" y="92" class="txt">F10</text><text x="35" y="165" class="txt">STOP + SAVE</text><text x="35" y="193" class="sub">finalize MP4</text><circle cx="220" cy="180" r="10" fill="#22c55e" class="led" style="animation-delay:1s"/></g><path d="M785 310h100" class="sweep"/><g transform="translate(890 200)"><rect width="220" height="220" rx="30" class="key press" style="animation-delay:2s"/><rect x="25" y="25" width="170" height="105" rx="20" fill="#020617" stroke="#334155"/><text x="82" y="92" class="txt">F8</text><text x="35" y="165" class="txt">CAMERA</text><text x="35" y="193" class="sub">toggle</text><circle cx="170" cy="180" r="10" fill="#38bdf8" class="led" style="animation-delay:2s"/></g><path d="M1125 310h80" class="sweep"/><g transform="translate(1210 200)"><rect width="180" height="220" rx="30" class="key press" style="animation-delay:3s"/><rect x="25" y="25" width="130" height="105" rx="20" fill="#020617" stroke="#334155"/><text x="68" y="92" class="txt">F7</text><text x="35" y="165" class="txt">MIC</text><text x="35" y="193" class="sub">toggle</text><circle cx="135" cy="180" r="10" fill="#f59e0b" class="led" style="animation-delay:3s"/></g><text x="545" y="500" class="sub">F9 → F10 → F8 → F7 · repeat</text></svg>