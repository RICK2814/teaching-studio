<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430"><defs><linearGradient id="g"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><style>.k{fill:#0f172a;stroke:#475569;stroke-width:3}.t{font:700 23px ui-monospace,monospace;fill:#e2e8f0}.s{font:500 15px ui-monospace,monospace;fill:#94a3b8}.p{animation:p 1s ease-in-out infinite;transform-origin:center}.l{stroke:url(#g);stroke-width:4;stroke-dasharray:10 10;animation:d 1s linear infinite}@keyframes p{50%{transform:translateY(8px);fill:#172554}}@keyframes d{to{stroke-dashoffset:-20}}</style></defs><rect width="1200" height="430" rx="30" fill="#020617"/><text x="65" y="65" class="t" style="font-size:36px">GLOBAL HOTKEYS</text><text x="65" y="98" class="s">Control recording without leaving the lesson.</text><g transform="translate(90 160)"><rect width="210" height="170" rx="22" class="k p"/><text x="35" y="55" class="t">F9</text><text x="35" y="95" class="s">START</text><text x="35" y="125" class="s">recording</text></g><path d="M310 245h90" class="l"/><g transform="translate(410 160)"><rect width="210" height="170" rx="22" class="k"/><text x="35" y="55" class="t">F10</text><text x="35" y="95" class="s">STOP + SAVE</text><text x="35" y="125" class="s">finalize MP4</text></g><path d="M630 245h90" class="l"/><g transform="translate(730 160)"><rect width="170" height="170" rx="22" class="k p"/><text x="35" y="55" class="t">F8</text><text x="35" y="95" class="s">CAMERA</text><text x="35" y="125" class="s">toggle</text></g><path d="M910 245h70" class="l"/><g transform="translate(990 160)"><rect width="120" height="170" rx="22" class="k"><text x="28" y="55" class="t">F7</text><text x="28" y="95" class="s">MIC</text><text x="28" y="125" class="s">toggle</text></g></svg>