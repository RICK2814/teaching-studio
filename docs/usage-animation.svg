<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-labelledby="t d"><title id="t">Animated Teaching Studio usage workflow</title><desc id="d">A bright developer-style six-stage workflow animation from setup to exported MP4.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#050816"/><stop offset=".5" stop-color="#111b3b"/><stop offset="1" stop-color="#071a28"/></linearGradient><linearGradient id="neon"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.card{fill:#0b1224;stroke:#334155;stroke-width:2}.txt{font:700 25px ui-monospace,monospace;fill:#e2e8f0}.sub{font:500 17px ui-monospace,monospace;fill:#94a3b8}.scan{stroke:url(#neon);stroke-width:6;stroke-linecap:round;filter:url(#glow);stroke-dasharray:30 24;animation:dash 1.1s linear infinite}.pulse{animation:pulse 1.7s ease-in-out infinite}.lift{animation:lift 2.4s ease-in-out infinite}.bar{animation:bar 3.4s ease-in-out infinite}.dot{animation:dot 3.4s ease-in-out infinite} @keyframes dash{to{stroke-dashoffset:-54}}@keyframes pulse{50%{opacity:.2;transform:scale(1.16)}}@keyframes lift{50%{transform:translateY(-10px)}}@keyframes bar{0%,15%{width:0}75%,100%{width:100%}}@keyframes dot{0%,15%{cx:0}75%,100%{cx:100%}}</style></defs><rect width="1600" height="600" rx="38" fill="url(#bg)"/><text x="85" y="88" class="txt" style="font-size:42px">USAGE · SIX MOVES</text><text x="85" y="122" class="sub">From first-run setup → teaching → final MP4 export</text><g transform="translate(80 205)"><rect width="210" height="190" rx="26" class="card lift"/><text x="28" y="55" class="txt">01 · SETUP</text><text x="28" y="95" class="sub">Camera</text><text x="28" y="123" class="sub">Microphone</text><text x="28" y="151" class="sub">Quality</text><circle cx="175" cy="45" r="9" fill="#22c55e" class="pulse"/></g><path d="M300 300h92" class="scan" fill="none"/><g transform="translate(400 205)"><rect width="210" height="190" rx="26" class="card"/><text x="28" y="55" class="txt">02 · OVERLAY</text><text x="28" y="95" class="sub">Shape · Size</text><text x="28" y="123" class="sub">Position</text><text x="28" y="151" class="sub">Border · Shadow</text></g><path d="M620 300h92" class="scan" fill="none"/><g transform="translate(720 205)"><rect width="210" height="190" rx="26" class="card lift"><text x="28" y="55" class="txt">03 · RECORD</text><text x="28" y="95" class="sub">Dashboard</text><text x="28" y="123" class="sub">Press F9</text><circle cx="174" cy="142" r="12" fill="#ef4444" class="pulse"/><text x="28" y="168" class="sub">LIVE</text></g><path d="M940 300h92" class="scan" fill="none"/><g transform="translate(1040 205)"><rect width="210" height="190" rx="26" class="card"><text x="28" y="55" class="txt">04 · TEACH</text><text x="28" y="95" class="sub">Camera bubble</text><text x="28" y="123" class="sub">stays on top</text><text x="28" y="151" class="sub">while you teach</text></g><path d="M1260 300h92" class="scan" fill="none"/><g transform="translate(1360 205)"><rect width="160" height="190" rx="26" class="card lift"/><text x="24" y="55" class="txt">05 · SAVE</text><text x="24" y="95" class="sub">Press F10</text><text x="24" y="123" class="sub">MP4</text><circle cx="120" cy="150" r="18" fill="none" stroke="#22c55e" stroke-width="5" class="pulse"/></g><g transform="translate(300 465)"><rect width="1000" height="22" rx="11" fill="#111827" stroke="#334155"/><rect x="0" y="0" width="0" height="22" rx="11" fill="url(#neon)" class="bar"/><circle cy="11" r="9" fill="#67e8f9" filter="url(#glow)" class="dot"/></g><text x="610" y="535" class="sub">setup → overlay → record → teach → save → repeat</text></svg>