<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520"><defs><linearGradient id="g"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><style>.c{fill:#0f172a;stroke:#334155;stroke-width:2}.t{font:700 20px ui-monospace,monospace;fill:#e2e8f0}.s{font:500 15px ui-monospace,monospace;fill:#94a3b8}.p{animation:p 1.8s ease-in-out infinite}.l{stroke:url(#g);stroke-width:5;stroke-dasharray:10 10;animation:d 1s linear infinite}@keyframes p{50%{opacity:.3;transform:translateY(-8px)}}@keyframes d{to{stroke-dashoffset:-20}}</style></defs><rect width="1400" height="520" rx="32" fill="#020617"/><text x="70" y="70" class="t" style="font-size:38px">RECORD IN SIX MOVES</text><text x="70" y="105" class="s">A teaching-first flow from first-run setup to final MP4.</text><g transform="translate(80 175)"><rect width="180" height="180" rx="24" class="c p"/><text x="25" y="55" class="t">01</text><text x="25" y="92" class="t">SETUP</text><text x="25" y="125" class="s">Camera</text><text x="25" y="150" class="s">Mic · Quality</text></g><path d="M270 265h70" class="l"/><g transform="translate(350 175)"><rect width="180" height="180" rx="24" class="c"/><text x="25" y="55" class="t">02</text><text x="25" y="92" class="t">OVERLAY</text><text x="25" y="125" class="s">Shape · Size</text><text x="25" y="150" class="s">Position</text></g><path d="M540 265h70" class="l"/><g transform="translate(620 175)"><rect width="180" height="180" rx="24" class="c p"><text x="25" y="55" class="t">03</text><text x="25" y="92" class="t">RECORD</text><text x="25" y="125" class="s">Press F9</text><text x="25" y="150" class="s">Start</text></g><path d="M810 265h70" class="l"/><g transform="translate(890 175)"><rect width="180" height="180" rx="24" class="c"><text x="25" y="55" class="t">04</text><text x="25" y="92" class="t">TEACH</text><text x="25" y="125" class="s">Bubble stays</text><text x="25" y="150" class="s">on top</text></g><path d="M1080 265h70" class="l"/><g transfor