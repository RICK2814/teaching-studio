<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><title id="t">Animated Teaching Studio usage workflow</title>
<desc id="d">A six-stage developer-style workflow animation from first-run setup through recording, teaching and final MP4 export.</desc>
<defs>
  <linearGradient id="ubg" x1="0" x2="1"><stop stop-color="#050816"/><stop offset=".5" stop-color="#111b3b"/><stop offset="1" stop-color="#071a28"/></linearGradient>
  <linearGradient id="uneon" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  <filter id="uglow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .card{fill:#0b1224;stroke:#334155;stroke-width:2}
    .txt{font:800 21px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#e2e8f0}
    .sub{font:500 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#94a3b8}
    .head{font:800 40px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#fff}
    .lead{font:500 17px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#94a3b8}
    .scan{stroke:url(#uneon);stroke-width:5;stroke-linecap:round;filter:url(#uglow);stroke-dasharray:16 16;animation:udash 1s linear infinite}
    .lift{transform-box:fill-box;transform-origin:center;animation:ulift 3s ease-in-out infinite}
    .spin{transform-box:fill-box;transform-origin:center;animation:uspin 6s linear infinite}
    .pulse{transform-box:fill-box;transform-origin:center;animation:upulse 1.6s ease-in-out infinite}
    .blink{animation:ublink 1.2s steps(2,end) infinite}
    .stack{transform-box:fill-box;transform-origin:center;animation:ustack 2.6s ease-in-out infinite}
    .bar4{transform-box:fill-box;transform-origin:bottom;animation:ubar 1.1s ease-in-out infinite}
    .check{stroke-dasharray:40;stroke-dashoffset:40;animation:udraw 3.2s ease-in-out infinite}
    .fill{width:0;animation:ufill 6.4s ease-in-out infinite}
    .dot{cx:0;animation:umove 6.4s ease-in-out infinite}
    @keyframes udash{to{stroke-dashoffset:-32}}
    @keyframes ulift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes uspin{to{transform:rotate(360deg)}}
    @keyframes upulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.5)}}
    @keyframes ublink{50%{opacity:.15}}
    @keyframes ustack{0%,100%{opacity:.5}50%{opacity:1}}
    @keyframes ubar{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
    @keyframes udraw{0%,55%{stroke-dashoffset:40}85%,100%{stroke-dashoffset:0}}
    @keyframes ufill{0%,10%{width:0}90%,100%{width:850}}
    @keyframes umove{0%,10%{cx:0}90%,100%{cx:850}}
  </style>
</defs>
<rect width="1600" height="620" rx="38" fill="url(#ubg)"/>
<text x="80" y="80" class="head">USAGE · SIX MOVES</text>
<text x="80" y="112" class="lead">First-run setup → teaching live → final MP4 export</text>
<g transform="translate(70 170)">
  <rect width="195" height="190" rx="24" class="card lift"/>
  <g class="spin"><circle cx="45" cy="45" r="16" fill="none" stroke="#38bdf8" stroke-width="4"/><rect x="41" y="21" width="8" height="10" fill="#38bdf8"/><rect x="41" y="59" width="8" height="10" fill="#38bdf8"/><rect x="21" y="41" width="10" height="8" fill="#38bdf8"/><rect x="59" y="41" width="10" height="8" fill="#38bdf8"/></g>
  <text x="24" y="105" class="txt">01 · SETUP</text><text x="24" y="133" class="sub">Camera · Mic</text><text x="24" y="153" class="sub">Quality · Background</text>
</g>
<path d="M275 265h100" class="scan" fill="none"/>
<g transform="translate(390 170)">
  <rect width="195" height="190" rx="24" class="card"/><rect x="24" y="26" width="70" height="46" rx="8" fill="none" stroke="#8b5cf6" stroke-width="3"/><circle cx="88" cy="60" r="16" fill="#0b1224" stroke="#22d3ee" stroke-width="3" class="lift"/>
  <text x="24" y="105" class="txt">02 · OVERLAY</text><text x="24" y="133" class="sub">Shape · Position</text><text x="24" y="153" class="sub">Border · Shadow</text>
</g>
<path d="M595 265h100" class="scan" fill="none"/>
<g transform="translate(710 170)">
  <rect width="195" height="190" rx="24" class="card"/><circle cx="45" cy="45" r="14" fill="#ef4444" class="pulse"/>
  <text x="24" y="105" class="txt">03 · RECORD</text><text x="24" y="133" class="sub">Dashboard</text><text x="24" y="153" class="sub blink">Press F9 · REC</text>
</g>
<path d="M915 265h100" class="scan" fill="none"/>
<g transform="translate(1030 170)">
  <rect width="195" height="190" rx="24" class="card"/><rect x="24" y="24" width="52" height="40" rx="8" fill="#0b1224" stroke="#475569" stroke-width="3" opacity=".6"/><rect x="42" y="34" width="52" height="40" rx="8" fill="#0b1224" stroke="#38bdf8" stroke-width="3" class="stack"/>
  <text x="24" y="105" class="txt">04 · TEACH</text><text x="24" y="133" class="sub">Bubble stays</text><text x="24" y="153" class="sub">on top always</text>
</g>
<path d="M1127 360 V395 H167" class="scan" fill="none"/>
<g transform="translate(70 395)">
  <rect width="195" height="190" rx="24" class="card"/><g transform="translate(24 26)"><rect x="0" y="20" width="8" height="10" class="bar4" fill="#22d3ee"/><rect x="13" y="10" width="8" height="30" class="bar4" fill="#22d3ee" style="animation-delay:.15s"/><rect x="26" y="0" width="8" height="40" class="bar4" fill="#22d3ee" style="animation-delay:.3s"/><rect x="39" y="12" width="8" height="28" class="bar4" fill="#22d3ee" style="animation-delay:.45s"/></g>
  <text x="24" y="105" class="txt">05 · CONTROL</text><text x="24" y="133" class="sub">F7 mic toggle</text><text x="24" y="153" class="sub">F8 camera toggle</text>
</g>
<path d="M275 490h100" class="scan" fill="none"/>
<g transform="translate(390 395)">
  <rect width="195" height="190" rx="24" class="card"/><circle cx="46" cy="46" r="24" fill="none" stroke="#22c55e" stroke-width="4"/><path d="M34 46l9 9 15-18" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class="check"/>
  <text x="24" y="105" class="txt">06 · FINISH</text><text x="24" y="133" class="sub">Press F10</text><text x="24" y="153" class="sub">Final MP4 saved</text>
</g>
<g transform="translate(710 480)"><rect width="850" height="18" rx="9" fill="#111827" stroke="#334155"/><rect class="fill" height="18" rx="9" fill="url(#uneon)"/><circle cy="9" r="8" fill="#67e8f9" filter="url(#uglow)" class="dot"/></g>
<text x="710" y="540" class="sub">setup → overlay → record → teach → control → finish → repeat</text>
</svg>